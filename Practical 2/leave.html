<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEAVE APPLICATION</title>
    <link rel="stylesheet" href="./css/style5.css">
</head>
<body>
    <h1 style="color:rgb(0, 0, 18);">LEAVE APPLICATION</h1>
    <div class="center">
    <label style="color:rgb(1, 1, 16);">ATTACH MEDICAL CERTIFICATES</label><br>
  <input style="color:rgb(26, 26, 238);" type="file" name="medical_certificate"><br><br>
  <label style="color:rgb(1, 1, 21);">DATE OF LEAVE:</label><br>
     <input style="color:rgb(28, 28, 242);" type="date" name="leave_date"><br><br>
     <label>NUMBER OF DAYS YOU TOOK LEAVE?</label><br><br>

        <input  style="color:rgb(6, 6, 168);" type="radio" name="disease" value="just a day"> Just a  Day<br>
        <input style="color:rgb(6, 6, 168);" type="radio" name="disease" value="2 days"> 2 Days<br>
        <input style="color:rgb(6, 6, 168);" type="radio" name="disease" value="3 days"> 3 Days<br>
        <input style="color:rgb(6, 6, 168);" type="radio" name="disease" value="5 days"> 5 Days<br>
        <input style="color:rgb(6, 6, 168);" type="radio" name="disease" value="more than a week"> More Than a Week<br>
        <input style="color:rgb(6, 6, 168);" type="radio" name="disease" value="approx 15 days"> Approx 15 Days<br><br>
    </div>
    
    <script src="../../theme.js"></script>
</body>
</html>
